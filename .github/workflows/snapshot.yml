name: snapshot

# Stores a dated copy of the two public boards under results/<UTC date>/.
# The site's daily reasoning eval runs at 08:00 UTC; this runs 90 minutes later.
# It needs no secrets: it reads two public endpoints and commits with the
# workflow's own token.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keeps its credentials (the default): the last step pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Take the snapshot
        run: node scripts/snapshot.mjs

      - name: Commit only if something changed
        run: |
          if [ -z "$(git status --porcelain -- results)" ]; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "results: snapshot $(date -u +%Y-%m-%d)"
          # A push by the owner may have landed while this job ran: put the
          # day on top of it instead of losing it to a rejected push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push the snapshot after 3 attempts." >&2
          exit 1
